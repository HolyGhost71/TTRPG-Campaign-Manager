<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />


   <!-- Mobile -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />


    <!-- Browser -->
    <title>Dungeon Drafts | TTRPG Campaign Manager</title>

    <meta
      name="description"
      content="Dungeon Drafts is a campaign manager for TTRPG groups. Organise NPCs, players, locations, quests and session notes in one place."
    />

    <meta
      name="theme-color"
      content="#222831"
    />

    <!-- Prevent search engines from using poor autogenerated descriptions -->
    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Open Graph - Discord, Facebook, etc. -->
    <meta
      property="og:title"
      content="Dungeon Drafts | TTRPG Campaign Manager"
    />

    <meta
      property="og:description"
      content="Organise your TTRPG campaign, NPCs, locations, quests and session notes in one place."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:image"
      content="/dungeon-drafts-preview.png"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Dungeon Drafts | TTRPG Campaign Manager"
    />

    <meta
      name="twitter:description"
      content="Organise your TTRPG campaign, NPCs, locations, quests and session notes in one place."
    />

    <meta
      name="twitter:image"
      content="/dungeon-drafts-preview.png"
    />

    <!-- Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
